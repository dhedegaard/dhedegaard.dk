name: CI

on: [push]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          CI: true
          GITHUB_PAT: ${{ secrets._GITHUB_PAT }}
      # Runs after build so the generated src/graphql-env.d.ts exists and
      # graphql.ts's import resolves; knip itself needs no GITHUB_PAT.
      - run: npm run knip
